name: Docker build and smoke tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build production container (includes type check)
        run: docker build -t tamam-announcement-builder:test .
      - name: Test container access controls and persistence
        run: node scripts/test-standalone.mjs --docker
